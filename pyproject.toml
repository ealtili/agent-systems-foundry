[project]
name = "claude-agent-foundry"
version = "0.1.0"
description = "A test-driven systems laboratory for mastering Claude, the Claude Agent SDK, MCP, and agentic architectures."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40.0",
    "claude-agent-sdk>=0.1.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.28.0",
    "tree-sitter>=0.23.0",
    "networkx>=3.4.0",
    "playwright>=1.49.0",
    "pyrit>=0.4.0",
    "opentelemetry-api>=1.29.0",
    "opentelemetry-sdk>=1.29.0",
    "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foundry"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B", "UP", "C4", "SIM", "TID"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "labs"]
asyncio_mode = "auto"
markers = [
    "unit: Pure deterministic unit tests",
    "integration: Component integration tests",
    "trajectory: Multi-step agent replay evaluations",
    "redteam: Adversarial security and PyRIT tests",
]